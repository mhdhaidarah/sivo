<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SIVO">
  <defs>
    <linearGradient id="sivo-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="sivo-glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sivo-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- SAMM's tile and SAMM's colours (cyan -> blue -> purple), like the other
       products' marks. A TV with a play mark: SecuryTik IPTV & Video Operations. -->
  <rect width="64" height="64" rx="14" fill="url(#sivo-bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sivo-glow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
  <g fill="none" stroke="url(#sivo-stroke)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M25 13.5 L32 20 L39 13.5" stroke-width="2.6"/>
    <rect x="11" y="20" width="42" height="28" rx="5.5" stroke-width="3.2"/>
    <path d="M23 53 H41" stroke-width="3"/>
  </g>
  <path d="M28.5 27.6 L39.2 34 L28.5 40.4 Z" fill="#22d3ee"/>
</svg>
